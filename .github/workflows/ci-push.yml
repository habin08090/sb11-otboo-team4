name: CI (Push)

on:
  push:
    branches: [ dev, main ]

permissions: { }

jobs:
  codecov:
    name: Upload coverage to Codecov
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find PR for this commit
        id: pr
        run: |
          PR_INFO=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0] | {number: (.number // ""), sha: (.head.sha // "")}' \
            2>/dev/null || echo '{"number":"","sha":""}')
          echo "number=$(echo "$PR_INFO" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$PR_INFO" | jq -r '.sha')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find PR CI run ID
        id: run
        if: steps.pr.outputs.sha != ''
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci-pr.yml/runs?head_sha=$PR_HEAD_SHA&status=completed" \
            --jq "[.workflow_runs[] | {id, created_at}] | sort_by(.created_at) | reverse | first | .id" \
            2>/dev/null || true)
          echo "id=${RUN_ID:-}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.sha }}

      - name: Download Jacoco report from PR CI
        id: download
        if: steps.run.outputs.id != '' && steps.run.outputs.id != 'null'
        continue-on-error: true
        run: |
          rm -rf /tmp/jacoco-report
          gh run download ${{ steps.run.outputs.id }} \
            --repo ${{ github.repository }} \
            --name jacoco-report \
            --dir /tmp/jacoco-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Jacoco XML path
        id: report
        if: steps.download.outcome == 'success'
        run: |
          REPORT_FILE=$(find /tmp/jacoco-report -type f -name 'jacocoTestReport.xml' | head -n 1)
          echo "file=$REPORT_FILE" >> $GITHUB_OUTPUT

      - name: Upload to Codecov
        if: steps.report.outputs.file != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.file }}
          fail_ci_if_error: true

      - name: Skip (no PR artifact found)
        if: >-
          steps.pr.outputs.sha == '' ||
          steps.run.outputs.id == '' ||
          steps.run.outputs.id == 'null' ||
          steps.download.outcome != 'success'
        run: echo "No PR artifact found — Codecov upload skipped"

  warm-es-cache:
    name: Warm Elasticsearch image cache
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & warm Elasticsearch image cache
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: docker/elasticsearch
          tags: otboo-es:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
